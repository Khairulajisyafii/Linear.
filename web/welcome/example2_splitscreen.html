<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Split Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#A9C52F',
                        dark: '#000000',
                        light: '#F5F7F8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-light h-screen flex flex-col md:flex-row">
    <!-- Kiri (Warna Brand) -->
    <div class="md:w-1/2 bg-primary flex flex-col justify-center p-12 lg:p-24 h-1/2 md:h-full">
        <h2 class="text-dark text-4xl lg:text-5xl font-bold mb-4">Linear.</h2>
        <p class="text-dark text-lg font-medium opacity-80">
            Cara cerdas untuk mengelola pekerjaan Anda. Lebih cepat, lebih terorganisir.
        </p>
    </div>
    
    <!-- Kanan (Konten Utama) -->
    <div class="md:w-1/2 bg-light flex flex-col justify-center p-12 lg:p-24 h-1/2 md:h-full">
        <h1 class="text-dark text-4xl font-extrabold mb-6">Mulai Sekarang</h1>
        <p class="text-gray-600 mb-8">
            Bergabunglah dengan ribuan pengguna lainnya yang telah mempercayakan alur kerja mereka bersama kami.
        </p>
        <div class="flex flex-col gap-4">
            <a href="../login register/index.html" class="text-center bg-dark text-light font-bold py-3 px-6 rounded-lg hover:bg-gray-800 transition duration-300">
                Buat Akun
            </a>
            <a href="../login register/index.html" class="text-center border-2 border-dark text-dark font-bold py-3 px-6 rounded-lg hover:bg-dark hover:text-light transition duration-300">
                Masuk ke Akun
            </a>
        </div>
    </div>
</body>
</html>
